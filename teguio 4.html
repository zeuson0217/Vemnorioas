<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeGuio - Lista de Espera</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f9;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 24px;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            max-width: 140px;
            height: auto;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 26px;
            color: var(--primary-color);
            margin: 0 0 16px 0;
            line-height: 1.2;
        }

        p {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .mascote {
            width: 100%;
            max-width: 250px;
            height: auto;
            margin: 10px 0 30px 0;
            filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.15));
        }

        .waitlist-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        input[type="email"] {
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input[type="email"]:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 16px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo puxando diretamente o arquivo da pasta -->
        <img src="IMG_1437.png" alt="Logo TeGuio" class="logo">
        
        <h1>Segurança e Inclusão na Palma da Mão</h1>
        <p>A plataforma de perfis digitais via QR code. Cadastre-se na lista de espera para receber acesso antecipado.</p>

        <!-- Mascote puxando diretamente o arquivo da pasta -->
        <img src="IMG_1438.png" alt="Mascote TeGuio" class="mascote">

        <form class="waitlist-form" onsubmit="event.preventDefault(); alert('Obrigado! Seu e-mail foi registrado na lista de espera.');">
            <input type="email" placeholder="Digite seu melhor e-mail" required>
            <button type="submit">Garantir Acesso Antecipado</button>
        </form>
    </div>

</body>
</html>
